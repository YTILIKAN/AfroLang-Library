services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afriland
    ports:
      - "5432:5432"
    volumes:
      - afriland_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afriland"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  afriland_pg_data:
